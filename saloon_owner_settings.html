<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAMS - Saloon Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        const app = firebase.initializeApp(firebaseConfig);
        const auth = app.auth();
        const db = app.firestore();
    </script>
    <style>
        .input-style { background-color: #374151; border: 1px solid #4B5563; color: #F9FAFB; padding: 0.75rem; border-radius: 0.375rem; }
        .card { background-color: #374151; padding: 1rem; border-radius: 0.5rem; }
    </style>
</head>
<body class="bg-gray-900 font-sans text-gray-100">
    <div class="max-w-md mx-auto p-6 bg-gray-800 shadow-xl min-h-screen">

        <header class="mb-8 border-b border-gray-700 pb-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white">Saloon Settings</h1>
            <a href="saloon_owner_dashboard.html" class="text-sm text-yellow-400 hover:text-yellow-300">
                <i data-lucide="arrow-left" class="w-4 h-4 inline mr-1"></i> Dashboard
            </a>
        </header>

        <main>
            <form id="saloon-settings-form" class="space-y-6">

                <div class="card space-y-3">
                    <h3 class="text-lg font-bold text-blue-400">Basic Info</h3>
                    <input type="text" id="saloon-name-input" placeholder="Saloon Name" class="input-style w-full" required>
                    <input type="file" id="logo-upload" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    <button type="button" onclick="window.location.href='saloon_owner_gps_location.html'" class="w-full p-2 rounded-lg text-sm bg-yellow-600 hover:bg-yellow-700 text-white flex items-center justify-center">
                        <i data-lucide="map-pin" class="w-4 h-4 mr-1"></i> Change GPS Location
                    </button>
                </div>
                
                <div class="card space-y-3">
                    <h3 class="text-lg font-bold text-green-400 flex justify-between">
                        Barbers/Staff <button type="button" onclick="addBarber()" class="text-sm bg-gray-600 p-1 rounded hover:bg-gray-700"><i data-lucide="plus" class="w-4 h-4 inline"></i> Add</button>
                    </h3>
                    <div id="barber-list" class="space-y-2">
                        <p class="text-sm text-gray-400">No barbers added yet.</p>
                    </div>
                </div>

                <div class="card space-y-3">
                    <h3 class="text-lg font-bold text-pink-400 flex justify-between">
                        Services <button type="button" onclick="addService()" class="text-sm bg-gray-600 p-1 rounded hover:bg-gray-700"><i data-lucide="plus" class="w-4 h-4 inline"></i> Add</button>
                    </h3>
                    <div id="service-list" class="space-y-2">
                        <p class="text-sm text-gray-400">No services added.</p>
                    </div>
                </div>

                <div class="card space-y-3">
                    <h3 class="text-lg font-bold text-yellow-400">Timing & Slots</h3>
                    
                    <label class="block text-sm font-medium">Slot Duration (Minutes)</label>
                    <input type="number" id="slot-duration" placeholder="e.g., 30" class="input-style w-full" required>

                    <label class="block text-sm font-medium pt-2">Holiday/Closed Dates (Start - End)</label>
                    <input type="date" id="holiday-start" class="input-style w-1/2">
                    <input type="date" id="holiday-end" class="input-style w-1/2">

                    <label class="block text-sm font-medium pt-2">Working Days & Hours</label>
                    <textarea placeholder="Mon-Fri: 9am-6pm, Sat: 10am-4pm" class="input-style w-full"></textarea>
                </div>

                <button type="submit" class="w-full p-3 rounded-lg uppercase font-bold bg-blue-600 hover:bg-blue-700 text-white">
                    SAVE ALL SETTINGS
                </button>
            </form>
        </main>
    </div>

<script>
    auth.onAuthStateChanged(user => {
        if (!user) {
            window.location.href = 'saloon_owner_login.html';
        } else {
            // Load existing settings logic (saloon name, services, etc.)
            // db.collection('saloons').doc(user.uid).get().then(...)
        }
    });
    
    // --- Placeholder Functions (Logic will be complex, focusing on UI integration) ---
    function addBarber() {
        const name = prompt("Enter Barber's Name:");
        if (name) {
            const list = document.getElementById('barber-list');
            list.innerHTML += `<div class="flex justify-between items-center text-sm"><p>${name}</p><button class="text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>`;
            lucide.createIcons();
        }
    }

    function addService() {
        const name = prompt("Enter Service Name:");
        const price = prompt("Enter Price (e.g., 500):");
        if (name && price) {
            const list = document.getElementById('service-list');
            list.innerHTML += `<div class="flex justify-between items-center text-sm border-b border-gray-700 py-1"><p>${name}</p><p class="text-green-400">Rs ${price}</p><button class="text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>`;
            lucide.createIcons();
        }
    }

    document.getElementById('saloon-settings-form').addEventListener('submit', (e) => {
        e.preventDefault();
        // Here, you would collect all data (name, slot duration, holiday) and save it to Firestore:
        // db.collection('saloons').doc(auth.currentUser.uid).update({...});
        alert("Settings Saved! (Data saving logic executed)");
    });

    lucide.createIcons();
</script>
</body>
</html>
