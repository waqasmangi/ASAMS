<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAMS - Welcome</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background-container">
        </div>
    <div class="main-container">
        <div class="welcome-card">
            <h1 class="logo">Gentleman's Grooming Co.</h1>
            <p>Welcome to Ayaan Saloon Appointment Management System (ASAMS)</p>
            <div class="form-section">
                <h2>Welcome</h2>
                <div class="login-options">
                    <button id="login-btn" class="primary-btn">LOG IN</button>
                    <button id="signup-btn" class="secondary-btn">SIGN UP</button>
                    <button id="guest-btn" class="text-btn">Browse as Guest</button>
                </div>

                <form id="login-form" class="auth-form" style="display: none;">
                    <input type="email" id="login-email" placeholder="Email" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit" class="primary-btn">Log In</button>
                    <p class="switch-link">Don't have an account? <a href="#" onclick="showSignup()">Sign Up</a></p>
                </form>

                <form id="signup-form" class="auth-form" style="display: none;">
                    <input type="text" id="signup-name" placeholder="Full Name" required>
                    <input type="email" id="signup-email" placeholder="Email" required>
                    <input type="password" id="signup-password" placeholder="Password" required>
                    <select id="signup-role">
                        <option value="customer">Customer</option>
                        <option value="store_owner">Store Owner</option>
                        </select>
                    <button type="submit" class="primary-btn">Sign Up</button>
                    <p class="switch-link">Already have an account? <a href="#" onclick="showLogin()">Log In</a></p>
                </form>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
