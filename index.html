<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAMS - Book Appointment</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase Functions required for callable functions -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-functions.js"></script>
    <script type="module" src="js/index.js"></script>
</head>
<body>
    <div class="container py-8" id="booking-app">
        <header class="text-center mb-8">
            <h1 class="text-4xl text-primary font-bold"><span id="saloon-name">Saloon Booking</span></h1>
            <p class="text-lg text-gray-500">Secure your spot for the best experience.</p>
        </header>

        <div id="loading-state" class="loading-spinner" style="display: none;"></div>

        <div class="card max-w-3xl mx-auto">
            <div class="booking-steps">
                <span class="step active" data-step="1">1. Service</span>
                <span class="step" data-step="2">2. Time & Date</span>
                <span class="step" data-step="3">3. Details</span>
            </div>

            <!-- STEP 1: Service Selection -->
            <div id="step-1" class="step-content">
                <h2>Select Service</h2>
                <div id="services-list-step-1" class="mt-4">
                    <!-- Services populate here -->
                </div>
                <p class="text-sm text-gray-500 mt-4">Click 'Select' on a service to continue.</p>
            </div>

            <!-- STEP 2: Time & Date Selection -->
            <div id="step-2" class="step-content" style="display: none;">
                <h2>Choose Date & Time Slot</h2>
                <button id="back-to-step-1" class="btn btn-outline mb-4">← Change Service</button>
                
                <label for="date-picker">Select Date</label>
                <input type="date" id="date-picker" required class="mb-4">
                
                <h3 class="mt-4 mb-2">Available Time Slots (<span id="selected-service-name"></span>)</h3>
                <div id="time-slot-picker" class="time-slot-picker mb-4">
                    <!-- Time slots populate here -->
                </div>
                
                <div id="slot-message" style="display: none;"></div>
                
                <button id="next-to-step-3" class="btn btn-primary btn-block">Next: Enter Details →</button>
            </div>

            <!-- STEP 3: Customer Details -->
            <div id="step-3" class="step-content" style="display: none;">
                <h2>Your Details</h2>
                <div id="final-message" style="display: none;"></div>
                
                <form id="booking-form">
                    <p class="text-sm text-gray-500 mb-4">Please provide your details for confirmation and SMS notification.</p>

                    <label for="customer-name">Full Name</label>
                    <input type="text" id="customer-name" required placeholder="Jane Doe">

                    <label for="customer-phone">Phone Number (Required for SMS)</label>
                    <input type="tel" id="customer-phone" required placeholder="+12294665689 (E.164 Format)">

                    <label for="customer-email">Email Address (Optional)</label>
                    <input type="email" id="customer-email" placeholder="jane@example.com">

                    <button type="submit" class="btn btn-secondary btn-block mt-4">
                        <span id="final-submit-text">Confirm Booking & Notify</span>
                    </button>
                </form>
            </div>
        </div>

    </div>
</body>
</html>
