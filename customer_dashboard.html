<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAMS - Customer Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        const app = firebase.initializeApp(firebaseConfig);
        const auth = app.auth();
        const db = app.firestore();
    </script>
    <style>
        .card { background-color: #374151; padding: 1rem; border-radius: 0.5rem; }
    </style>
</head>
<body class="bg-gray-900 font-sans text-gray-100">
    <div class="max-w-md mx-auto p-6 bg-gray-800 shadow-xl min-h-screen">

        <header class="mb-8 border-b border-gray-700 pb-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white">Welcome, Customer!</h1>
            <button onclick="auth.signOut().then(() => window.location.href='customer_login.html')" class="text-sm text-red-400 flex items-center">
                <i data-lucide="log-out" class="w-4 h-4 mr-1"></i> Logout
            </button>
        </header>

        <main class="space-y-6">
            
            <div id="location-prompt" class="card text-center border-2 border-yellow-400 p-6">
                <h2 class="text-xl font-bold mb-3">Find Saloons Near You</h2>
                <p class="text-gray-300 mb-4">Please share your current GPS location to find registered saloons within a 500 meter radius.</p>
                <button onclick="requestLocation()" class="w-full p-3 rounded-lg uppercase font-bold bg-green-500 hover:bg-green-600 text-white flex items-center justify-center">
                    <i data-lucide="map-pin" class="w-5 h-5 mr-2"></i> SHARE LOCATION
                </button>
            </div>

            <div id="appointments-overview" class="card">
                <h2 class="text-lg font-bold mb-3">Your Upcoming Appointments</h2>
                <div id="upcoming-list">
                    <p class="text-gray-400">No appointments booked yet.</p>
                </div>
            </div>

        </main>
    </div>

<script>
    const RADIUS_M = 500; // 500 meter search radius
    let currentUserData = {};

    auth.onAuthStateChanged(user => {
        if (!user) {
            window.location.href = 'customer_login.html';
            return;
        }

        // Check if location is already set
        db.collection('customers').doc(user.uid).get().then(doc => {
            if (doc.exists) {
                currentUserData = doc.data();
                if (currentUserData.isLocationSet === true && currentUserData.currentLat) {
                    // Location previously set, skip prompt and show dashboard
                    document.getElementById('location-prompt').style.display = 'none';
                    searchAndDisplaySaloons(currentUserData.currentLat, currentUserData.currentLng);
                }
            }
        });
    });

    window.requestLocation = () => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                
                // 1. Save location as a "last known" location
                db.collection('customers').doc(auth.currentUser.uid).update({
                    currentLat: lat,
                    currentLng: lng,
                    isLocationSet: true
                });

                // 2. Hide prompt and search
                document.getElementById('location-prompt').style.display = 'none';
                searchAndDisplaySaloons(lat, lng);

            }, () => {
                alert("Location access denied or failed. Please try enabling GPS.");
            });
        } else {
            alert("Geolocation is not supported by your browser.");
        }
    };

    function searchAndDisplaySaloons(userLat, userLng) {
        // NOTE: This geosearch logic requires advanced Firestore indexing (Geohashing) 
        // which is handled by Cloud Functions/GeoFire. For client-side simulation:

        const saloonListElement = document.getElementById('upcoming-list');
        saloonListElement.innerHTML = `<p class="text-yellow-400">Searching for saloons within ${RADIUS_M} meters...</p>`;
        
        // --- SIMULATION OF SEARCH ---
        db.collection('applications')
            .where('status', '==', 'Approved')
            .limit(5) // Limit to a few for quick display
            .get()
            .then(snapshot => {
                saloonListElement.innerHTML = '';
                let found = false;
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    // In a real system, we'd use data.location.lat/lng and calculate distance.
                    // Assuming for SIMULATION that the first few are "nearby".
                    
                    saloonListElement.innerHTML += `
                        <div class="card p-3 border-l-4 border-green-400 flex justify-between items-center hover:bg-gray-700">
                            <div>
                                <p class="font-semibold text-white">${data.saloonName}</p>
                                <p class="text-sm text-gray-400">0.2 km away</p>
                            </div>
                            <a href="customer_find_saloons.html?saloon=${data.uid}" class="text-sm text-blue-400">View & Book</a>
                        </div>
                    `;
                    found = true;
                });

                if (!found) {
                    saloonListElement.innerHTML = `<p class="text-red-400">No saloon found within the 500 meter radius.</p>`;
                }
            });
    }

    lucide.createIcons();
</script>
</body>
</html>
