<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAMS - Master Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase Functions required for callable functions -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-functions.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/master_admin.js"></script>
</head>
<body class="dashboard-layout">
    <header class="header">
        <h1>ASAMS Master Control</h1>
        <button id="logout-btn" class="btn btn-primary">Sign Out</button>
    </header>

    <main class="main-content">
        <div id="dashboard-message" style="display: none;"></div>

        <section class="mb-8">
            <h2>Onboard New Saloon & Owner</h2>
            <div class="card max-w-none">
                <div id="onboard-message" style="display: none;"></div>
                <form id="onboard-form" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Column 1: Saloon Details -->
                    <div>
                        <label for="saloonName">Saloon Name</label>
                        <input type="text" id="saloonName" name="saloonName" required placeholder="The Royal Clipper">
                    </div>
                    <div>
                        <label for="ownerName">Owner Full Name</label>
                        <input type="text" id="ownerName" name="ownerName" required placeholder="John Doe">
                    </div>
                    <div>
                        <label for="ownerPhone">Owner Phone (for Twilio)</label>
                        <input type="tel" id="ownerPhone" name="ownerPhone" required placeholder="+12294665689">
                    </div>
                    <!-- Column 2: Login Credentials -->
                    <div>
                        <label for="email">Owner Email (Login)</label>
                        <input type="email" id="email" name="email" required placeholder="owner@saloon.com">
                    </div>
                    <div>
                        <label for="password">Initial Password</label>
                        <input type="password" id="password" name="password" required minlength="8" placeholder="Must be 8+ characters">
                    </div>
                    
                    <div class="md:col-span-2 lg:col-span-3">
                        <button type="submit" class="btn btn-secondary btn-block mt-4">Create & Start 15-Day Trial</button>
                    </div>
                </form>
            </div>
        </section>

        <section>
            <h2>Active & Trial Saloons</h2>
            <div id="saloons-list" class="mt-4">
                <!-- Saloon list will be populated here by js/master_admin.js -->
                <div class="loading-spinner"></div>
            </div>
        </section>
    </main>
</body>
</html>
