<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAMS - Set Saloon Location</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        const app = firebase.initializeApp(firebaseConfig);
        const auth = app.auth();
        const db = app.firestore();
    </script>
    <style>
        .input-style { background-color: #374151; border: 1px solid #4B5563; color: #F9FAFB; padding: 0.75rem; border-radius: 0.375rem; }
    </style>
</head>
<body class="bg-gray-900 font-sans text-gray-100">
    <div class="max-w-md mx-auto p-6 bg-gray-800 shadow-xl min-h-screen">

        <header class="mb-8 text-center">
            <h1 class="text-xl font-bold text-yellow-400">Set Saloon Location</h1>
            <p class="text-sm text-gray-400 mt-2">This is required for customers to find you (500m radius search).</p>
        </header>

        <main>
            <form id="location-form" class="space-y-4">
                
                <button type="button" id="gps-button" class="w-full p-3 rounded-lg uppercase font-bold bg-green-500 hover:bg-green-600 text-white flex items-center justify-center">
                    <i data-lucide="map-pin" class="w-5 h-5 inline mr-2"></i> USE CURRENT GPS LOCATION
                </button>
                
                <p class="text-center text-gray-400">-- OR ENTER MANUALLY --</p>

                <input type="text" id="manual-address" placeholder="Manual Address (Street, City, etc.)" class="input-style w-full" required>
                
                <input type="hidden" id="latitude">
                <input type="hidden" id="longitude">

                <button type="submit" class="w-full p-3 rounded-lg uppercase font-bold bg-blue-600 hover:bg-blue-700 text-white">
                    SAVE & GO TO DASHBOARD
                </button>
            </form>
        </main>
    </div>

<script>
    auth.onAuthStateChanged(user => {
        if (!user) {
            window.location.href = 'saloon_owner_login.html';
        }
    });

    document.getElementById('gps-button').addEventListener('click', () => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                document.getElementById('latitude').value = position.coords.latitude;
                document.getElementById('longitude').value = position.coords.longitude;
                alert(`GPS Location captured! Lat: ${position.coords.latitude}, Lng: ${position.coords.longitude}`);
            }, () => {
                alert("Could not get GPS location. Please enter manually.");
            });
        } else {
            alert("Geolocation is not supported by your browser.");
        }
    });

    document.getElementById('location-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const user = auth.currentUser;
        const uid = user.uid;
        
        const latitude = document.getElementById('latitude').value;
        const longitude = document.getElementById('longitude').value;
        const manualAddress = document.getElementById('manual-address').value;

        if (!latitude && !manualAddress) {
            alert("Please use GPS or enter the manual address.");
            return;
        }

        db.collection('applications').doc(uid).update({
            location: {
                lat: latitude || null,
                lng: longitude || null,
                manualAddress: manualAddress,
                isSet: true // Flag to skip this screen next time
            },
            address: manualAddress // Update main address field
        })
        .then(() => {
            alert("Location saved successfully!");
            window.location.href = 'saloon_owner_dashboard.html';
        })
        .catch(error => {
            alert(`Error saving location: ${error.message}`);
        });
    });
    lucide.createIcons();
</script>
</body>
</html>
