<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAMS - Saloon GPS Location</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
	<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>

<script src="firebase-config.js"></script>

<script>
    // Initialize Firebase using the config object from firebase-config.js
    const app = firebase.initializeApp(firebaseConfig);
    const auth = app.auth();
    const db = app.firestore();
    const functions = app.functions('us-central1'); // Use the correct region if different
</script>

    <style>
        /* CSS Variables for Branding */
        :root {
            --dark-navy: #1C2431;
            --gold: #D4AF37;
            --darker-bg: #151C25; 
        }

        /* Custom Gold Gradient Button Class */
        .gold-gradient-button {
            background-image: linear-gradient(180deg, #E6C86C, var(--gold));
            color: var(--darker-bg); 
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        /* Custom Input Styling (Pill-shaped, dark background) */
        .custom-input {
            background-color: var(--dark-navy); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 1rem;
            border-radius: 9999px; /* Pill-shaped */
            font-size: 0.875rem;
            width: 100%;
        }

        /* Custom Font Classes */
        .font-cinzel {
            font-family: 'Cinzel', serif;
        }
        .font-inter {
            font-family: 'Inter', sans-serif;
        }
        
        /* Simulated Map Container */
        .map-container {
            height: 200px;
            background-color: #A0AEC0; /* Light gray to simulate a map */
            background-image: url('https://via.placeholder.com/350x200?text=Map+Placeholder');
            background-size: cover;
            background-position: center;
            border-radius: 0.75rem;
            position: relative;
        }
    </style>
</head>

<body class="font-inter bg-gray-900 min-h-screen flex flex-col">

    <div class="flex-grow max-w-sm mx-auto w-full p-4 sm:p-6 flex flex-col">

        <header class="flex justify-between items-center pt-2 pb-6">
            <div class="flex items-center space-x-2 text-white">
                <div class="relative">
                    <i data-lucide="scissors" class="w-8 h-8" style="color: var(--gold);"></i>
                </div>
                <div class="flex flex-col items-start">
                    <span class="font-cinzel text-lg tracking-widest leading-none" style="color: var(--gold);">ASAMS</span>
                    <span class="text-xs tracking-wider uppercase text-gray-400">OWNER PORTAL</span>
                </div>
            </div>
            <i data-lucide="settings" class="w-6 h-6 text-gray-400 cursor-pointer"></i>
        </header>

        <main class="flex-grow pb-24">
            <h1 class="text-2xl font-bold text-white tracking-wider mb-6 font-cinzel text-center">
                SET SALOON ADDRESS
            </h1>

            <div class="map-container mb-4 shadow-xl">
                <i data-lucide="map-pin" class="w-8 h-8 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-full text-red-600" style="filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));"></i>
            </div>
            
            <form action="#" method="POST" class="space-y-4">

                <button type="button" class="w-full p-4 rounded-full uppercase font-bold text-sm text-black border-2 flex items-center justify-center" style="background-color: var(--gold); border-color: var(--gold);">
                    <i data-lucide="map-pin" class="w-5 h-5 mr-2"></i>
                    USE CURRENT GPS LOCATION
                    <i data-lucide="alert-circle" class="w-4 h-4 ml-2"></i>
                </button>
                
                <p class="text-xs text-center text-gray-400 pt-2">--- OR ENTER ADDRESS MANUALLY ---</p>

                <div class="relative">
                    <input type="text" id="street-address" name="street_address" required placeholder="Street Address"
                        class="custom-input"
                        value="123 Barber Street"
                    >
                </div>

                <div class="relative">
                    <input type="text" id="city" name="city" required placeholder="City: Metroville"
                        class="custom-input"
                        value="Metroville"
                    >
                </div>
                
                <div class="relative">
                    <input type="text" id="state-province" name="state_province" required placeholder="State/Province: NY"
                        class="custom-input"
                        value="NY"
                    >
                </div>
                
                <div class="relative">
                    <input type="text" id="zip-code" name="zip_code" required placeholder="Zip/Postal Code: 10001"
                        class="custom-input"
                        value="10001"
                    >
                </div>

                <button type="submit" class="w-full p-4 mt-6 rounded-full uppercase font-bold text-lg gold-gradient-button">
                    SAVE ADDRESS
                </button>
            </form>

        </main>
        
    </div>

    <footer class="fixed bottom-0 left-0 right-0 p-3 shadow-top" style="background-color: var(--dark-navy);">
        <nav class="max-w-md mx-auto flex justify-around items-center text-xs font-inter uppercase text-gray-400">
            <a href="#" class="flex flex-col items-center hover:text-white">
                <i data-lucide="home" class="w-5 h-5 mb-1"></i>
                HOME
            </a>
            <a href="#" class="flex flex-col items-center hover:text-white">
                <i data-lucide="calendar-check" class="w-5 h-5 mb-1"></i>
                APPOINTMENTS
            </a>
            <a href="#" class="flex flex-col items-center hover:text-white">
                <i data-lucide="users" class="w-5 h-5 mb-1"></i>
                PEOPLE
            </a>
            <a href="#" class="flex flex-col items-center hover:text-white">
                <i data-lucide="message-square" class="w-5 h-5 mb-1"></i>
                MESSAGES
            </a>
            <a href="#" class="flex flex-col items-center" style="color: var(--gold);">
                <i data-lucide="star" class="w-5 h-5 mb-1"></i>
                REVIEWS
            </a>
        </nav>
    </footer>

</body>
</html>
