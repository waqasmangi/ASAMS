<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAMS - Saloon Owner Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        const app = firebase.initializeApp(firebaseConfig);
        const auth = app.auth();
        const db = app.firestore();
    </script>
    <style>
        .input-style { background-color: #374151; border: 1px solid #4B5563; color: #F9FAFB; padding: 0.75rem; border-radius: 0.375rem; }
    </style>
</head>
<body class="bg-gray-900 font-sans text-gray-100">
    <div class="max-w-md mx-auto p-6 bg-gray-800 shadow-xl min-h-screen flex flex-col justify-center">

        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white">ASAMS Saloon Owner</h1>
            <p class="text-sm text-gray-400 mt-2">Log in to manage your business.</p>
        </header>

        <form id="owner-login-form" class="space-y-4">
            <input type="email" id="email-address" placeholder="Email Address" class="input-style w-full" required>
            <input type="password" id="password" placeholder="Password" class="input-style w-full" required>
            
            <button type="submit" class="w-full p-3 rounded-lg uppercase font-bold bg-yellow-500 text-gray-900 hover:bg-yellow-400">
                LOG IN
            </button>
        </form>

        <div class="mt-4 text-center">
            <a href="saloon_owner_signup.html" class="text-gray-400 text-sm hover:text-white">New user? Sign Up</a>
        </div>
    </div>

<script>
    const loginForm = document.getElementById('owner-login-form');
    
    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email-address').value;
        const password = document.getElementById('password').value;

        // 1. Authenticate user
        auth.signInWithEmailAndPassword(email, password)
            .then((userCredential) => {
                const user = userCredential.user;
                
                // 2. Check application/subscription status
                return db.collection('applications').doc(user.uid).get();
            })
            .then((doc) => {
                if (!doc.exists) {
                    alert("Account record not found. Access denied.");
                    auth.signOut();
                    return;
                }

                const data = doc.data();
                const now = new Date();
                
                if (data.status === 'Pending') {
                    alert("Your application is pending approval by the Master Admin. Please wait.");
                    auth.signOut();
                } else if (data.status === 'Approved' && data.trialEnd.toDate() < now) {
                    alert(`Access Denied: Your trial expired on ${data.trialEnd.toDate().toDateString()}. Please renew your subscription.`);
                    auth.signOut();
                    // Redirect to subscription page
                    window.location.href = 'saloon_owner_subscription.html';
                } else {
                    // Approved and Trial is active OR Status is Paid/Active
                    alert("Login successful!");
                    // First-time users need to set GPS location
                    window.location.href = 'saloon_owner_gps_location.html';
                }
            })
            .catch((error) => {
                alert(`Login Failed: ${error.message}`);
            });
    });
    lucide.createIcons();
</script>
</body>
</html>
