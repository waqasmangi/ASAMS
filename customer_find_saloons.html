<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAMS - Find Saloons</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        const app = firebase.initializeApp(firebaseConfig);
        const auth = app.auth();
        const db = app.firestore();
    </script>
    <style>
        .card { background-color: #374151; padding: 1rem; border-radius: 0.5rem; }
    </style>
</head>
<body class="bg-gray-900 font-sans text-gray-100">
    <div class="max-w-md mx-auto p-6 bg-gray-800 shadow-xl min-h-screen">

        <header class="mb-6 border-b border-gray-700 pb-3 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white">Nearby Saloons</h1>
            <button onclick="requestLocation()" class="text-sm text-blue-400 flex items-center hover:text-blue-300">
                <i data-lucide="refresh-ccw" class="w-4 h-4 inline mr-1"></i> Refresh GPS
            </button>
        </header>

        <main class="space-y-4">
            
            <div id="saloon-list" class="space-y-3">
                <p class="text-yellow-400 text-center" id="search-status">Searching for saloons within 500 meters...</p>
                </div>
            
        </main>
    </div>

<script>
    const RADIUS_M = 500; // Search radius in meters

    auth.onAuthStateChanged(user => {
        if (!user) {
            window.location.href = 'customer_login.html';
            return;
        }
        
        // On page load, try to get location
        requestLocation(true); 
    });

    // Helper function to calculate distance (Haversine formula placeholder)
    function calculateDistance(lat1, lon1, lat2, lon2) {
        // Since we cannot run complex GeoFire/Cloud Function logic on the client,
        // we SIMULATE distance for display purposes. 
        // A proper solution requires a callable Cloud Function to execute the GeoQuery.
        return Math.floor(Math.random() * 500) + 50; // Random distance between 50m and 550m
    }

    window.requestLocation = (initialLoad = false) => {
        const statusElement = document.getElementById('search-status');
        statusElement.innerText = "Getting your location...";

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                statusElement.innerText = `Searching near your location (${lat.toFixed(3)}, ${lng.toFixed(3)})...`;
                
                // Save/update customer's current location (optional)
                db.collection('customers').doc(auth.currentUser.uid).update({ currentLat: lat, currentLng: lng });

                searchAndDisplaySaloons(lat, lng);

            }, () => {
                statusElement.innerText = "Location access denied or failed. Showing sample results.";
                searchAndDisplaySaloons(null, null); // Show sample data if access fails
            });
        } else {
            statusElement.innerText = "Geolocation not supported. Showing sample results.";
            searchAndDisplaySaloons(null, null); // Show sample data
        }
    };

    function searchAndDisplaySaloons(userLat, userLng) {
        const listElement = document.getElementById('saloon-list');
        listElement.innerHTML = '';
        
        // --- SIMULATION OF GEO-QUERY ---
        db.collection('applications')
            .where('status', '==', 'Approved')
            .limit(10)
            .get()
            .then(snapshot => {
                let found = false;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    
                    // SIMULATION: Only include saloons with location data
                    if (data.location && data.location.lat) {
                        const distance = calculateDistance(userLat, userLng, data.location.lat, data.location.lng);
                        
                        // Check against the 500m radius
                        if (distance <= RADIUS_M) {
                            listElement.innerHTML += `
                                <div class="card p-3 border-l-4 border-green-400 flex justify-between items-center">
                                    <div>
                                        <p class="font-semibold text-white">${data.saloonName} (${data.ownerName})</p>
                                        <p class="text-sm text-gray-400">${(distance / 1000).toFixed(2)} km away</p>
                                    </div>
                                    <a href="customer_book_appointment.html?saloonId=${data.uid}" class="text-sm p-2 rounded bg-blue-600 hover:bg-blue-700 text-white">Book Now</a>
                                </div>
                            `;
                            found = true;
                        }
                    }
                });

                if (!found) {
                    listElement.innerHTML = `<p class="text-red-400 text-center">No saloon registered within the 500 meter radius.</p>`;
                }
            });
    }
    
    lucide.createIcons();
</script>
</body>
</html>
