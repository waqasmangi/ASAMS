<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAMS - Saloon Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        const app = firebase.initializeApp(firebaseConfig);
        const auth = app.auth();
        const db = app.firestore();
        const functions = app.functions('us-central1');
        const sendSmsFunction = functions.httpsCallable('sendSms');
    </script>
    <style>
        .card { background-color: #374151; padding: 1rem; border-radius: 0.5rem; }
        .input-style { background-color: #374151; border: 1px solid #4B5563; color: #F9FAFB; padding: 0.75rem; border-radius: 0.375rem; }
    </style>
</head>
<body class="bg-gray-900 font-sans text-gray-100">
    <div class="max-w-md mx-auto p-6 bg-gray-800 shadow-xl min-h-screen">

        <header class="mb-8 border-b border-gray-700 pb-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white">Saloon Applications</h1>
            <a href="master_admin_dashboard.html" class="text-sm text-yellow-400 hover:text-yellow-300">
                <i data-lucide="arrow-left" class="w-4 h-4 inline mr-1"></i> Dashboard
            </a>
        </header>

        <main class="space-y-6">

            <div class="card">
                <h2 class="text-lg font-bold mb-3 text-red-400">Pending Applications</h2>
                <div id="pending-applications-list" class="space-y-3">
                    <p class="text-gray-400">Loading pending applications...</p>
                </div>
            </div>

            <div class="card">
                <h2 class="text-lg font-bold mb-3 text-green-400">Active & Approved Saloons</h2>
                <div id="approved-saloons-list" class="space-y-3">
                    <p class="text-gray-400">Loading approved saloons...</p>
                </div>
            </div>
            
        </main>
    </div>

<script>
    let adminSettings = {};

    auth.onAuthStateChanged(user => {
        if (!user || user.email !== 'waqasmangi.uk@gmail.com') {
            window.location.href = 'master_admin_login.html';
        } else {
            // Load Admin settings for sending WhatsApp links
            db.collection('settings').doc('admin').get().then(doc => {
                if (doc.exists) {
                    adminSettings = doc.data();
                }
                loadApplications();
            });
        }
    });
    
    // Helper to format date
    const formatDate = (timestamp) => {
        if (!timestamp) return 'N/A';
        return timestamp.toDate().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    };

    function createSaloonCard(data, isPending) {
        const div = document.createElement('div');
        div.className = 'p-4 rounded-xl shadow-lg flex flex-col space-y-3 border border-gray-700';
        div.style.backgroundColor = isPending ? '#341A1C' : '#1F2937'; 
        
        const trialEndDisplay = data.trialEnd ? formatDate(data.trialEnd) : 'N/A';
        
        div.innerHTML = `
            <div class="flex justify-between items-start">
                <div>
                    <h3 class="text-lg font-bold text-white">${data.saloonName}</h3>
                    <p class="text-sm text-gray-400">Owner: ${data.ownerName} | ${data.contactNumber}</p>
                    <p class="text-xs text-gray-500">${data.address}</p>
                </div>
                <span class="text-xs font-semibold px-3 py-1 rounded-full ${isPending ? 'bg-red-500' : 'bg-green-500'} text-white">
                    ${isPending ? 'PENDING' : 'APPROVED'}
                </span>
            </div>
            
            <div class="border-t border-gray-700 pt-3 flex justify-between items-center text-sm text-gray-300">
                <p>Trial Ends:</p>
                <p class="font-bold">${trialEndDisplay}</p>
            </div>

            <div class="pt-3 flex space-x-2">
                ${isPending ? `
                    <button onclick="approveApplication('${data.uid}', '${data.email}', '${data.contactNumber}')" class="flex-1 p-2 rounded-full uppercase text-xs font-bold bg-green-600 text-white hover:bg-green-700">
                        APPROVE
                    </button>
                ` : `
                    <button onclick="editSaloon('${data.uid}')" class="flex-1 p-2 rounded-full uppercase text-xs font-bold bg-blue-600 text-white hover:bg-blue-700">
                        EDIT DETAILS
                    </button>
                `}
                <button onclick="sendMessage('${data.contactNumber}', '${data.saloonName}', '${data.ownerName}')" class="flex-1 p-2 rounded-full uppercase text-xs font-bold bg-yellow-600 text-gray-900 hover:bg-yellow-500 flex items-center justify-center">
                    <i data-lucide="whatsapp" class="w-4 h-4 mr-1"></i> Message
                </button>
            </div>
        `;
        return div;
    }
    
    // --- Firestore Listener ---
    function loadApplications() {
        const pendingList = document.getElementById('pending-applications-list');
        const approvedList = document.getElementById('approved-saloons-list');
        pendingList.innerHTML = '<p class="text-gray-400">No pending applications.</p>';
        approvedList.innerHTML = '<p class="text-gray-400">No approved saloons yet.</p>';

        db.collection('applications').onSnapshot(snapshot => {
            pendingList.innerHTML = '';
            approvedList.innerHTML = '';
            let pendingCount = 0;
            let approvedCount = 0;
            
            snapshot.forEach(doc => {
                const data = doc.data();
                if (data.status === 'Pending') {
                    pendingList.appendChild(createSaloonCard(data, true));
                    pendingCount++;
                } else if (data.status === 'Approved' || data.status === 'Paid') {
                    approvedList.appendChild(createSaloonCard(data, false));
                    approvedCount++;
                }
            });

            if (pendingCount === 0) pendingList.innerHTML = '<p class="text-gray-400">No pending applications.</p>';
            if (approvedCount === 0) approvedList.innerHTML = '<p class="text-gray-400">No approved saloons yet.</p>';
            
            lucide.createIcons();
        });
    }
    
    // --- Approval Logic ---
    window.approveApplication = (uid, email, contactNumber) => {
        if (!confirm(`Are you sure you want to approve the application for ${email}? This will start their 7-day trial.`)) return;

        const trialEnd = new Date();
        trialEnd.setDate(trialEnd.getDate() + 7);
        const trialEndTimestamp = firebase.firestore.Timestamp.fromDate(trialEnd);
        
        // 1. Update application status to Approved and set trial dates
        db.collection('applications').doc(uid).update({
            status: 'Approved',
            trialStart: firebase.firestore.FieldValue.serverTimestamp(),
            trialEnd: trialEndTimestamp
        })
        .then(() => {
            // 2. Send SMS Notification to Saloon Owner
            const ownerSmsBody = `Congratulation! Your request for ASAMS account has been approved by admin. You can access your account now with your details (Username: ${email}, Password: [set by you at the time of signup]). For any question, feel free to contact us.`;
            return sendSmsFunction({ to: contactNumber, body: ownerSmsBody })
                .catch(err => console.error("SMS notification failed:", err)); // Log SMS errors
        })
        .then(() => {
            alert(`Application for ${email} approved! Owner is now on 7-day trial.`);
        })
        .catch(error => {
            alert(`Approval failed: ${error.message}`);
        });
    };

    // --- Messaging Logic ---
    window.sendMessage = (contactNumber, saloonName, ownerName) => {
        const adminNumber = adminSettings.whatsappNumber;

        if (!adminNumber) {
            alert("Admin WhatsApp number is not set in settings. Cannot send message.");
            return;
        }
        
        // Construct a pre-filled message
        const message = `Dear ${ownerName} from ${saloonName}, I am the ASAMS Admin. I am contacting you regarding your subscription.`; 
        
        // Open WhatsApp Web/App from the ADMIN's WhatsApp number
        const whatsappURL = `https://wa.me/${adminNumber.replace('+', '')}?text=${encodeURIComponent(message)}`;
        window.open(whatsappURL, '_blank');
    };

    window.editSaloon = (uid) => {
        alert(`Redirecting to edit Saloon ID: ${uid}.`);
        // window.location.href = `master_admin_edit_saloon.html?uid=${uid}`; // Future edit page
    };

    lucide.createIcons();
</script>
</body>
</html>
