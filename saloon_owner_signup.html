<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAMS - Saloon Owner Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        const app = firebase.initializeApp(firebaseConfig);
        const auth = app.auth();
        const db = app.firestore();
        const functions = app.functions('us-central1');
        const sendSmsFunction = functions.httpsCallable('sendSms');
    </script>
    <style>
        .input-style { background-color: #374151; border: 1px solid #4B5563; color: #F9FAFB; padding: 0.75rem; border-radius: 0.375rem; }
    </style>
</head>
<body class="bg-gray-900 font-sans text-gray-100">
    <div class="max-w-md mx-auto p-6 bg-gray-800 shadow-xl min-h-screen">

        <header class="mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold text-white mb-2">Saloon Owner Sign Up</h1>
            <p class="text-gray-400">Register your saloon to start your 7-day free trial.</p>
        </header>

        <main>
            <form id="signup-form" class="space-y-4">
                <input type="text" id="owner-name" placeholder="Owner Full Name" required class="input-style w-full">
                <input type="text" id="saloon-name" placeholder="Saloon Name" required class="input-style w-full">
                <input type="email" id="email-address" placeholder="Login Email Address" required class="input-style w-full">
                <input type="tel" id="contact-number" placeholder="Contact Number (e.g., +923001234567)" pattern="^\+\d{10,14}$" title="Must be in +[countrycode][number] format (e.g., +923001234567)" required class="input-style w-full">
                <input type="password" id="password" placeholder="Password" required class="input-style w-full">
                <input type="password" id="confirm-password" placeholder="Confirm Password" required class="input-style w-full">
                <textarea id="address" placeholder="Saloon Address" rows="3" required class="input-style w-full"></textarea>

                <button type="submit" class="w-full p-4 mt-6 rounded-full uppercase font-bold text-lg bg-green-600 text-white hover:bg-green-700">
                    SUBMIT APPLICATION
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="saloon_owner_login.html" class="text-gray-400 text-sm hover:text-white transition duration-200">
                    Already have an account? <span class="underline">Log In</span>
                </a>
            </div>
        </main>
        
    </div>

    <div id="payment-popup" class="fixed inset-0 bg-black bg-opacity-75 hidden items-center justify-center p-4">
        <div class="bg-gray-800 p-6 rounded-lg shadow-2xl max-w-sm w-full space-y-4">
            <h2 class="text-xl font-bold text-yellow-400">IMPORTANT: Next Steps</h2>
            <p class="text-sm">Your application has been received and is under review. You are currently on a **7-day free trial**.</p>
            <p class="text-sm font-semibold">Subscription Fee: <span id="popup-fee" class="text-lg text-green-400"></span></p>

            <div class="border-t border-gray-700 pt-3 space-y-2">
                <h3 class="text-md font-bold text-white">Payment Details:</h3>
                <p class="text-xs text-gray-300"><span class="font-bold">EasyPesa:</span> <span id="popup-easypesa"></span></p>
                <p class="text-xs text-gray-300"><span class="font-bold">JazzCash:</span> <span id="popup-jazzcash"></span></p>
            </div>
            
            <button onclick="document.getElementById('payment-popup').classList.add('hidden')" class="w-full p-3 rounded-full uppercase text-sm font-bold bg-blue-600 text-white hover:bg-blue-700">
                CLOSE & PROCEED TO LOGIN
            </button>
        </div>
    </div>

<script>
    let adminSettings = {};

    // 1. Load Admin Settings (for subscription fee and payment details)
    db.collection('settings').doc('admin').get()
        .then(doc => {
            if (doc.exists) {
                adminSettings = doc.data();
            }
        })
        .catch(error => {
            console.error("Error loading admin settings:", error);
        });

    function showPaymentInfoPopup(fee, easyPesa, jazzCash) {
        document.getElementById('popup-fee').innerText = `Rs ${fee} / month`;
        document.getElementById('popup-easypesa').innerText = easyPesa;
        document.getElementById('popup-jazzcash').innerText = jazzCash;
        document.getElementById('payment-popup').classList.remove('hidden');
    }

    const signupForm = document.getElementById('signup-form');
    
    signupForm.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const ownerName = document.getElementById('owner-name').value;
        const saloonName = document.getElementById('saloon-name').value;
        const email = document.getElementById('email-address').value;
        const contactNumber = document.getElementById('contact-number').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        const address = document.getElementById('address').value;

        // Simple validation
        if (password !== confirmPassword) {
            alert("Passwords do not match.");
            return;
        }

        // 1. Create User in Firebase Authentication
        auth.createUserWithEmailAndPassword(email, password)
            .then((userCredential) => {
                const user = userCredential.user;
                
                // 2. Save Saloon Application Details to Firestore
                return db.collection('applications').doc(user.uid).set({
                    uid: user.uid,
                    ownerName: ownerName,
                    saloonName: saloonName,
                    email: email,
                    contactNumber: contactNumber,
                    address: address,
                    status: 'Pending', // Initial status is Pending
                    role: 'owner',
                    trialStart: null,
                    trialEnd: null,
                    logoUrl: '',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                });
            })
            .then(() => {
                // 4. Send SMS Notification to Saloon Owner
                const ownerSmsBody = `Dear Saloon Owner, Your request for ASAMS account has been received, your application is being reviewed by the Master Admin. Thanks for using ASAMS Service. please do not reply to this message.`;
                sendSmsFunction({ to: contactNumber, body: ownerSmsBody })
                    .catch(err => console.error("Owner SMS failed on signup:", err)); // FIX: Added error handling
                
                // 5. Send SMS Notification to Master Admin
                if (adminSettings.adminContactNumber) {
                    const adminSmsBody = `Dear Admin, ${ownerName} (${saloonName}) has applied for ASAMS account. Please review and approve the application.`;
                    sendSmsFunction({ to: adminSettings.adminContactNumber, body: adminSmsBody })
                        .catch(err => console.error("Admin SMS failed on signup:", err)); // FIX: Added error handling
                }

                // 6. Show Payment Details Pop-up
                showPaymentInfoPopup(
                    adminSettings.subscriptionFee || '499', // Default to 499 if not set
                    adminSettings.easyPesaDetails || 'N/A (Please set in Admin Panel)', 
                    adminSettings.jazzCashDetails || 'N/A (Please set in Admin Panel)'
                );
            })
            .catch((error) => {
                alert(`Error: ${error.message}. Please check console.`);
                console.error("Signup failed:", error);
            });
    });

    lucide.createIcons();
</script>
</body>
</html>
