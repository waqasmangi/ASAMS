<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAMS - Saloon Owner Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/saloon_admin.js"></script>
</head>
<body class="dashboard-layout">
    <header class="header">
        <div>
            <h1 id="saloon-name-display">Saloon Dashboard</h1>
            <p id="saloon-status" class="text-xs"></p>
        </div>
        <button id="logout-btn" class="btn btn-primary">Sign Out</button>
    </header>

    <main class="main-content">
        <div id="dashboard-message" style="display: none;"></div>
        
        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="services">Services</button>
            <button class="tab-btn" data-tab="config">Availability Config</button>
            <button class="tab-btn" data-tab="appointments">Appointments</button>
        </div>

        <!-- Services Tab -->
        <div id="services-content" class="tab-content">
            <section class="mb-8">
                <h2 id="service-form-title">Add New Service</h2>
                <div class="card max-w-none" id="service-form-card">
                    <div id="service-message" style="display: none;"></div>
                    <form id="service-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label for="service-name">Service Name</label>
                            <input type="text" id="service-name" required placeholder="Haircut & Style">
                        </div>
                        <div>
                            <label for="service-duration">Duration (Minutes)</label>
                            <input type="number" id="service-duration" required min="10" placeholder="e.g., 30">
                        </div>
                        <div>
                            <label for="service-price">Price ($)</label>
                            <input type="number" id="service-price" required min="0" step="0.01" placeholder="e.g., 25.00">
                        </div>
                        <div class="md:col-span-3">
                            <label for="service-description">Description (Optional)</label>
                            <textarea id="service-description" rows="2" placeholder="Brief description of the service"></textarea>
                        </div>
                        <div class="md:col-span-3">
                            <button type="submit" id="service-form-btn" class="btn btn-secondary btn-block">Add Service</button>
                            <button type="button" class="btn btn-outline btn-block mt-2" onclick="window.resetServiceForm()">Cancel/New Service</button>
                        </div>
                    </form>
                </div>
            </section>
            
            <section>
                <h2>Your Current Services</h2>
                <div id="services-list" class="mt-4">
                    <!-- Services list populated by js/saloon_admin.js -->
                    <div class="loading-spinner"></div>
                </div>
            </section>
        </div>

        <!-- Configuration Tab -->
        <div id="config-content" class="tab-content" style="display: none;">
            <h2>Working Hours & Slot Configuration</h2>
            <div class="card max-w-2xl">
                <div id="config-message" style="display: none;"></div>
                <form id="config-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="start-time">Business Start Time (24h)</label>
                        <input type="time" id="start-time" required>
                    </div>
                    <div>
                        <label for="end-time">Business End Time (24h)</label>
                        <input type="time" id="end-time" required>
                    </div>
                    <div>
                        <label for="lunch-start">Lunch Break Start</label>
                        <input type="time" id="lunch-start" required>
                    </div>
                    <div>
                        <label for="lunch-end">Lunch Break End</label>
                        <input type="time" id="lunch-end" required>
                    </div>
                    <div class="md:col-span-2">
                        <label for="slot-duration">Minimum Appointment Slot Duration (Minutes)</label>
                        <input type="number" id="slot-duration" required min="10" step="5" placeholder="e.g., 30">
                        <p class="text-xs text-gray-500 mt-[-0.5rem] mb-2">Service duration must be a multiple of this value.</p>
                    </div>
                    <div class="md:col-span-2">
                        <p class="font-semibold mb-2">Working Days: Monday - Friday (Hardcoded for this demo)</p>
                        <button type="submit" class="btn btn-primary btn-block">Save Availability</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Appointments Tab -->
        <div id="appointments-content" class="tab-content" style="display: none;">
            <h2>Upcoming Appointments</h2>
            <p class="text-sm text-gray-500 mb-4">Real-time view of confirmed bookings.</p>
            <div id="appointments-list">
                <!-- Appointments list populated by js/saloon_admin.js -->
                <div class="loading-spinner"></div>
            </div>
        </div>

    </main>
</body>
</html>
