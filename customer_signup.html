<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAMS - Customer Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        :root { --primary-dark: #1F2937; --accent-blue: #3B82F6; --text-light: #F9FAFB; }
        .btn-primary { background-color: var(--accent-blue); color: white; transition: background-color 0.2s; }
        .input-style { background-color: #374151; border: 1px solid #4B5563; color: var(--text-light); padding: 0.75rem; border-radius: 0.375rem; }
    </style>
</head>
<body class="bg-gray-900 font-sans text-gray-100">
    <div class="max-w-md mx-auto p-6 bg-gray-800 shadow-xl min-h-screen">

        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-white">ASAMS Customer Sign Up</h1>
            <p class="text-sm text-gray-400 mt-2">Enter your details and verify your phone number via OTP.</p>
        </header>

        <main>
            <form id="signup-form" class="space-y-4">
                <input type="text" id="full-name" placeholder="Full Name" class="input-style w-full" required>
                <input type="email" id="email-address" placeholder="Email Address" class="input-style w-full" required>
                <input type="password" id="create-password" placeholder="Create Password" class="input-style w-full" required>
                <input type="tel" id="contact-number" placeholder="Phone Number (+92XXXXXXXXXX)" class="input-style w-full" pattern="^\+92\d{10}$" title="Must be in +92xxxxxxxxxx format" required>
                
                <div id="recaptcha-container"></div>
                
                <button type="submit" id="send-otp-button" class="w-full p-3 rounded-lg uppercase font-bold btn-primary">
                    SEND OTP
                </button>
            </form>
            <div class="mt-4 text-center">
                <a href="customer_login.html" class="text-gray-400 text-sm hover:text-white">Already registered? Log In</a>
            </div>
        </main>
    </div>

<script>
    const app = firebase.initializeApp(firebaseConfig);
    const auth = app.auth();
    const db = app.firestore();
    
    // Global variable to store necessary details before OTP verification
    let userDetails = {};
    
    auth.onAuthStateChanged(user => {
        if (user) {
            // If user somehow gets here while logged in, redirect
            window.location.href = 'customer_dashboard.html'; 
        }
    });

    // 1. Initialize ReCAPTCHA Verifier
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
        'size': 'invisible',
        'callback': (response) => {
            // reCAPTCHA solved automatically after the first user interaction
        },
        'expired-callback': () => {
            alert("reCAPTCHA expired. Please try again.");
        }
    });


    document.getElementById('signup-form').addEventListener('submit', (e) => {
        e.preventDefault();
        
        userDetails.fullName = document.getElementById('full-name').value;
        userDetails.email = document.getElementById('email-address').value;
        userDetails.password = document.getElementById('create-password').value;
        userDetails.contactNumber = document.getElementById('contact-number').value; 
        
        const contactNumber = userDetails.contactNumber;

        // Ensure ReCAPTCHA is fully rendered before sending OTP
        const recaptcha = window.recaptchaVerifier;

        document.getElementById('send-otp-button').innerText = 'SENDING...';
        document.getElementById('send-otp-button').disabled = true;

        // 2. Send the OTP via Firebase Phone Auth
        auth.signInWithPhoneNumber(contactNumber, recaptcha)
            .then((confirmationResult) => {
                window.confirmationResult = confirmationResult;
                
                // Store temporary user details in local session
                sessionStorage.setItem('tempUserDetails', JSON.stringify(userDetails));

                // Redirect to the dedicated OTP verification page
                alert("OTP sent to your number. Redirecting for verification.");
                window.location.href = 'customer_otp_verification.html'; 
            })
            .catch((error) => {
                alert(`OTP sending failed: ${error.message}`);
                document.getElementById('send-otp-button').innerText = 'SEND OTP';
                document.getElementById('send-otp-button').disabled = false;
            });
    });

    lucide.createIcons();
</script>
</body>
</html>
