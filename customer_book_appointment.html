<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAMS - Book Appointment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        const app = firebase.initializeApp(firebaseConfig);
        const auth = app.auth();
        const db = app.firestore();
        const functions = app.functions('us-central1');
        const sendSmsFunction = functions.httpsCallable('sendSms');
    </script>
    <style>
        .input-style { background-color: #374151; border: 1px solid #4B5563; color: #F9FAFB; padding: 0.75rem; border-radius: 0.375rem; }
        .card { background-color: #374151; padding: 1rem; border-radius: 0.5rem; }
    </style>
</head>
<body class="bg-gray-900 font-sans text-gray-100">
    <div class="max-w-md mx-auto p-6 bg-gray-800 shadow-xl min-h-screen">

        <header class="mb-8 border-b border-gray-700 pb-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white" id="saloon-name-display">Book Appointment</h1>
            <button onclick="auth.signOut().then(() => window.location.href='customer_login.html')" class="text-sm text-red-400">Logout</button>
        </header>

        <main>
            <form id="booking-form" class="space-y-6">
                
                <div class="card space-y-3">
                    <h3 class="text-lg font-bold text-blue-400">1. Select Service</h3>
                    <select id="service-select" class="input-style w-full" required>
                        <option value="">-- Choose a Service --</option>
                        <option value="Haircut|500">Hair Cutting (Rs 500)</option>
                        <option value="Shave|300">Shave (Rs 300)</option>
                    </select>
                </div>

                <div class="card space-y-3">
                    <h3 class="text-lg font-bold text-green-400">2. Choose Barber & Time</h3>
                    <select id="barber-select" class="input-style w-full" required>
                        <option value="">-- Choose a Barber --</option>
                        <option value="Ahmad">Ahmad</option>
                        <option value="Usman">Usman</option>
                    </select>
                    <input type="date" id="appointment-date" class="input-style w-full" required>
                    <select id="appointment-time" class="input-style w-full" required>
                        <option value="">-- Choose Time Slot --</option>
                        <option value="10:00">10:00 AM</option>
                        <option value="11:30">11:30 AM</option>
                    </select>
                </div>

                <div class="card p-4 bg-gray-700">
                    <p class="font-bold text-white">TOTAL DUE: <span id="total-price">Rs 0</span> PKR</p>
                </div>

                <button type="submit" class="w-full p-3 rounded-lg uppercase font-bold bg-yellow-500 text-gray-900 hover:bg-yellow-400">
                    CONFIRM BOOKING
                </button>
            </form>
        </main>
    </div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const saloonId = urlParams.get('saloonId');
    let customerContact = '';

    auth.onAuthStateChanged(user => {
        if (!user) {
            window.location.href = 'customer_login.html';
            return;
        }
        // Fetch customer contact for SMS
        db.collection('customers').doc(user.uid).get().then(doc => {
            if (doc.exists) customerContact = doc.data().contactNumber;
        });

        // Load Saloon Name and Services
        db.collection('applications').doc(saloonId).get().then(doc => {
            if (doc.exists) {
                document.getElementById('saloon-name-display').innerText = doc.data().saloonName;
                // In a real app, populate services/barbers from saloon data
            }
        });
    });

    document.getElementById('service-select').addEventListener('change', (e) => {
        const [service, price] = e.target.value.split('|');
        document.getElementById('total-price').innerText = `Rs ${price || 0}`;
    });

    document.getElementById('booking-form').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const servicePrice = document.getElementById('service-select').value.split('|');
        const service = servicePrice[0];
        const price = servicePrice[1];
        const barber = document.getElementById('barber-select').value;
        const date = document.getElementById('appointment-date').value;
        const time = document.getElementById('appointment-time').value;
        
        const appointmentTime = new Date(`${date} ${time}`);
        const user = auth.currentUser;

        // 1. Save Appointment
        db.collection('appointments').add({
            customerId: user.uid,
            saloonId: saloonId,
            service: service,
            barber: barber,
            price: parseFloat(price),
            dateTime: firebase.firestore.Timestamp.fromDate(appointmentTime),
            status: 'Booked',
        })
        .then(() => {
            alert("Booking successful! Sending confirmation SMS.");
            
            // 2. Send SMS Notification to Customer
            const customerSmsBody = `ASAMS: Your appointment for ${service} on ${date} at ${time} with ${barber} is CONFIRMED. Total: Rs ${price}.`;
            sendSmsFunction({ to: customerContact, body: customerSmsBody });
            
            // 3. Setup Reminder/Feedback Trigger (Placeholder)
            // A scheduled Cloud Function would check the appointment time.
            const feedbackSmsTime = new Date(appointmentTime.getTime() + 60 * 60 * 1000); // 1 hour after appointment start

            console.log(`Placeholder: Feedback SMS should be sent around ${feedbackSmsTime.toLocaleString()}`);

            // 4. Redirect to confirmation page
            window.location.href = 'customer_appointment_confirmation.html';
        })
        .catch(error => {
            alert(`Booking failed: ${error.message}`);
        });
    });

    lucide.createIcons();
</script>
</body>
</html>
