<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAMS - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        const app = firebase.initializeApp(firebaseConfig);
        const auth = app.auth();
        const db = app.firestore();
        const functions = app.functions('us-central1');
    </script>
    <style>
        .card { background-color: #374151; padding: 1rem; border-radius: 0.5rem; }
    </style>
</head>
<body class="bg-gray-900 font-sans text-gray-100">
    <div class="max-w-xl mx-auto p-6 bg-gray-800 shadow-xl min-h-screen">

        <header class="mb-8 border-b border-gray-700 pb-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white">Admin Dashboard</h1>
            <a href="master_admin_settings.html" class="text-sm text-gray-400 hover:text-white">
                <i data-lucide="settings" class="w-5 h-5 inline"></i>
            </a>
        </header>

        <main class="space-y-6">
            
            <div class="card space-y-4">
                <h2 class="text-lg font-bold text-green-400">Total System Revenue</h2>
                <div class="flex justify-between items-center">
                    <p class="text-4xl font-extrabold" id="total-revenue">Rs 0</p>
                    <i data-lucide="trending-up" class="w-8 h-8 text-green-400"></i>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <a href="master_admin_saloon_management.html" class="card text-center bg-blue-600 hover:bg-blue-700">
                    <i data-lucide="store" class="w-8 h-8 mx-auto mb-1"></i>
                    <p>Manage Saloons</p>
                </a>
                <a href="master_admin_settings.html" class="card text-center bg-yellow-600 hover:bg-yellow-700">
                    <i data-lucide="dollar-sign" class="w-8 h-8 mx-auto mb-1"></i>
                    <p>Set Sub. Fee</p>
                </a>
            </div>

            <div class="card">
                <h2 class="text-lg font-bold mb-3">Activity Log</h2>
                <div id="activity-log" class="space-y-2">
                    <p class="text-gray-400">No new activities.</p>
                </div>
            </div>

            <div class="card">
                <h2 class="text-lg font-bold mb-3">Saloons Overview</h2>
                <div id="saloon-overview" class="space-y-3">
                    <p class="text-gray-400">Loading saloon data...</p>
                </div>
            </div>

        </main>
    </div>

<script>
    auth.onAuthStateChanged(user => {
        if (!user || user.email !== 'waqasmangi.uk@gmail.com') {
            window.location.href = 'master_admin_login.html';
        } else {
            loadDashboardData();
            setupExpirationCheck();
        }
    });

    function loadDashboardData() {
        // Load Saloons and calculate revenue
        db.collection('applications').onSnapshot(snapshot => {
            let totalRevenue = 0;
            const logElement = document.getElementById('activity-log');
            const overviewElement = document.getElementById('saloon-overview');
            logElement.innerHTML = '';
            overviewElement.innerHTML = '';

            snapshot.forEach(doc => {
                const data = doc.data();
                const now = new Date();
                const trialEnd = data.trialEnd ? data.trialEnd.toDate() : null;

                // 1. Calculate Revenue (Simplified: counting 'Paid' status as revenue)
                if (data.status === 'Paid') {
                    // Fetch subscription fee from settings for accurate calculation
                    db.collection('settings').doc('admin').get().then(settingsDoc => {
                        const fee = parseFloat(settingsDoc.data().subscriptionFee) || 499;
                        totalRevenue += fee;
                        document.getElementById('total-revenue').innerText = `Rs ${totalRevenue.toLocaleString()} PKR`;
                    });
                }

                // 2. Build Activity Log & Overview List
                if (data.status === 'Pending') {
                    logElement.innerHTML += `<p class="text-red-400"><i data-lucide="bell" class="w-4 h-4 inline mr-1"></i> **NEW APPLICATION:** ${data.ownerName} (${data.saloonName}) applied.</p>`;
                }

                if (trialEnd && trialEnd > now && trialEnd.getTime() - now.getTime() < (24 * 60 * 60 * 1000)) {
                    logElement.innerHTML += `<p class="text-yellow-400"><i data-lucide="alert-triangle" class="w-4 h-4 inline mr-1"></i> **TRIAL ENDING:** ${data.saloonName} trial expires tomorrow!</p>`;
                }

                overviewElement.innerHTML += `
                    <div class="flex justify-between text-sm border-b border-gray-700 py-1">
                        <p>${data.saloonName}</p>
                        <p class="${data.status === 'Approved' ? 'text-green-400' : 'text-red-400'}">${data.status} | Ends: ${trialEnd ? trialEnd.toLocaleDateString() : 'N/A'}</p>
                    </div>
                `;
            });
            lucide.createIcons();
        });
    }

    // Functionality to check for expiring trials and send SMS (needs admin contact number)
    function setupExpirationCheck() {
        // This should be done via a scheduled Cloud Function for true reliability (outside client scope),
        // but here we demonstrate the client-side logic placeholder.
        console.log("System is checking for trial expiration reminders...");
        // You would query Firestore for trials ending tomorrow and call sendSmsFunction()
    }
    
    lucide.createIcons();
</script>
</body>
</html>
