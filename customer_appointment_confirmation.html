<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAMS - Booking Confirmed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* CSS Variables for Branding */
        :root {
            --dark-navy: #1C2431;
            --gold: #D4AF37;
            --darker-bg: #151C25; 
        }

        /* Custom Gold Gradient Button Class */
        .gold-gradient-button {
            background-image: linear-gradient(180deg, #E6C86C, var(--gold));
            color: var(--darker-bg); 
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }
        .gold-gradient-button:hover {
            opacity: 0.9;
        }

        /* Custom Font Classes */
        .font-cinzel {
            font-family: 'Cinzel', serif;
        }
        .font-inter {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="font-inter bg-gray-900 min-h-screen flex flex-col">

    <div class="flex-grow max-w-sm mx-auto w-full p-4 sm:p-6 flex flex-col">

        <header class="flex items-center pt-2 pb-6 justify-center">
            <div class="flex items-center space-x-2 text-white">
                <div class="relative">
                    <i data-lucide="scissors" class="w-8 h-8" style="color: var(--gold);"></i>
                </div>
                <div class="flex flex-col items-start">
                    <span class="font-cinzel text-lg tracking-widest leading-none" style="color: var(--gold);">ASAMS</span>
                </div>
            </div>
        </header>

        <main class="flex-grow pb-24 text-center">
            
            <h1 class="text-3xl font-bold text-white tracking-wider mb-6 font-cinzel">
                BOOKING CONFIRMED!
            </h1>

            <div class="flex justify-center mb-8">
                <div class="p-4 rounded-full" style="background-color: var(--gold);">
                    <i data-lucide="check-circle" class="w-16 h-16 text-white"></i>
                </div>
            </div>

            <div class="p-4 rounded-xl shadow-lg mb-8" style="background-color: var(--darker-bg);">
                
                <div class="flex space-x-2 mb-4 justify-center">
                    <span class="px-4 py-1 text-xs font-semibold rounded-full bg-gray-700 text-white">TODAY</span>
                    <span class="px-4 py-1 text-xs font-semibold rounded-full bg-gray-700 text-white">TOMORROW, WEDNESDAY, OCT 25</span>
                </div>
                
                <div class="p-3 rounded-xl flex items-center space-x-3" style="background-color: var(--dark-navy);">
                    <div class="w-10 h-10 rounded-full bg-gray-600 border-2" style="border-color: var(--gold);"></div>
                    <div>
                        <p class="text-white font-semibold">The Gentleman's Cut</p>
                        <p class="text-xs text-gray-400">Barber Mike</p>
                    </div>
                </div>

                <div class="mt-4 text-left">
                    <p class="text-lg font-bold text-white">Haircut + Beard Trim</p>
                    <p class="text-sm text-gray-400">Date: Tomorrow, Wednesday, Oct 25 at 10:30 AM</p>
                </div>

                <div class="flex justify-between items-center mt-4 pt-3 border-t border-gray-700">
                    <div>
                        <p class="text-lg font-bold text-white">TOTAL: $40</p>
                        <p class="text-xs text-gray-400">Payment due at saloon</p>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center text-lg font-bold" style="color: var(--gold);">$</div>
                </div>
            </div>

            <a href="#" class="w-full p-4 rounded-full uppercase font-bold text-lg gold-gradient-button flex items-center justify-center">
                <i data-lucide="calendar-plus" class="w-6 h-6 mr-2"></i>
                ADD APPOINTMENT DETAILS
            </a>
            
        </main>
        
    </div>

    <footer class="fixed bottom-0 left-0 right-0 p-3 shadow-top" style="background-color: var(--dark-navy);">
        <nav class="max-w-md mx-auto flex justify-around items-center text-xs font-inter uppercase text-gray-400">
            <a href="#" class="flex flex-col items-center hover:text-white">
                <i data-lucide="home" class="w-5 h-5 mb-1"></i>
                HOME
            </a>
            <a href="#" class="flex flex-col items-center hover:text-white">
                <i data-lucide="calendar-check" class="w-5 h-5 mb-1"></i>
                APPOINTMENTS
            </a>
            <a href="#" class="flex flex-col items-center" style="color: var(--gold);">
                <i data-lucide="user" class="w-5 h-5 mb-1"></i>
                PROFILE
            </a>
            <a href="#" class="flex flex-col items-center hover:text-white">
                <i data-lucide="message-square" class="w-5 h-5 mb-1"></i>
                MESSAGES
            </a>
            <a href="#" class="flex flex-col items-center hover:text-white">
                <i data-lucide="star" class="w-5 h-5 mb-1"></i>
                REVIEWS
            </a>
        </nav>
    </footer>

</body>
</html>
