<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAMS - Owner Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        const app = firebase.initializeApp(firebaseConfig);
        const auth = app.auth();
        const db = app.firestore();
    </script>
    <style>
        .card { background-color: #374151; padding: 1rem; border-radius: 0.5rem; }
    </style>
</head>
<body class="bg-gray-900 font-sans text-gray-100">
    <div class="max-w-md mx-auto p-6 bg-gray-800 shadow-xl min-h-screen">

        <header class="mb-8 border-b border-gray-700 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-white">Owner Dashboard</h1>
                <p id="welcome-message" class="text-sm text-gray-400 mt-1">Welcome back!</p>
            </div>
            <button onclick="auth.signOut().then(() => window.location.href='saloon_owner_login.html')" class="text-sm text-red-400 flex items-center">
                <i data-lucide="log-out" class="w-4 h-4 mr-1"></i> Logout
            </button>
        </header>

        <main class="space-y-6">
            
            <div class="card space-y-4">
                <h2 class="text-lg font-bold text-yellow-400">Appointments Today</h2>
                <div class="flex justify-between items-center">
                    <p class="text-4xl font-extrabold" id="today-appointments">0</p>
                    <p class="text-2xl" id="saloon-rating">Rating: N/A</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <a href="saloon_owner_appointments.html" class="card text-center bg-blue-600 hover:bg-blue-700">
                    <i data-lucide="calendar-check" class="w-8 h-8 mx-auto mb-1"></i>
                    <p>Appointments</p>
                </a>
                <a href="saloon_owner_settings.html" class="card text-center bg-green-600 hover:bg-green-700">
                    <i data-lucide="wrench" class="w-8 h-8 mx-auto mb-1"></i>
                    <p>Saloon Settings</p>
                </a>
            </div>
            <div class="grid grid-cols-2 gap-4">
                 <a href="saloon_owner_subscription.html" class="card text-center bg-red-600 hover:bg-red-700">
                    <i data-lucide="credit-card" class="w-8 h-8 mx-auto mb-1"></i>
                    <p>Subscription</p>
                </a>
                <a href="saloon_owner_gps_location.html" class="card text-center bg-yellow-600 hover:bg-yellow-700">
                    <i data-lucide="map-pin" class="w-8 h-8 mx-auto mb-1"></i>
                    <p>Change Location</p>
                </a>
            </div>

            <div class="card">
                <h2 class="text-lg font-bold mb-3">Recent Activity</h2>
                <div id="recent-activity" class="space-y-2">
                    <p class="text-gray-400">No recent activity.</p>
                </div>
            </div>
        </main>
    </div>

<script>
    auth.onAuthStateChanged(user => {
        if (!user) {
            window.location.href = 'saloon_owner_login.html';
            return;
        }
        
        // 1. Check Subscription/Trial Status (Crucial)
        db.collection('applications').doc(user.uid).get().then(doc => {
            if (!doc.exists) {
                alert("Account record missing. Access denied.");
                auth.signOut();
                return;
            }

            const data = doc.data();
            const now = new Date();
            
            // Check if trial is expired and status is NOT paid
            if (data.trialEnd && data.trialEnd.toDate() < now && data.status !== 'Paid') {
                 alert("Your trial has expired. Please renew your subscription.");
                 window.location.href = 'saloon_owner_subscription.html';
                 auth.signOut();
                 return;
            }

            // 2. Check for GPS Location (First-time user setup)
            if (!data.location || data.location.isSet === false) {
                 alert("Welcome! Please set your saloon's location first.");
                 window.location.href = 'saloon_owner_gps_location.html';
                 return;
            }

            // 3. Update Dashboard Display
            document.getElementById('welcome-message').innerText = `Welcome back, ${data.ownerName} of ${data.saloonName}!`;
            loadDashboardData(user.uid);
            
        }).catch(error => {
            console.error("Dashboard check error:", error);
            auth.signOut();
        });
    });

    function loadDashboardData(saloonId) {
        // --- Placeholder for actual data loading ---
        // Fetch appointments where saloonId matches
        // db.collection('appointments').where('saloonId', '==', saloonId).where('dateTime', 'is today')...
        
        // Simulating data loading:
        document.getElementById('today-appointments').innerText = '5';
        document.getElementById('saloon-rating').innerText = 'Rating: 4.5/5';
        document.getElementById('recent-activity').innerHTML = '<p class="text-green-400">New appointment booked (1:30 PM).</p><p class="text-gray-400">Service list updated.</p>';
    }

    lucide.createIcons();
</script>
</body>
</html>
