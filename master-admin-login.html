<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAMS - Master Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        const app = firebase.initializeApp(firebaseConfig);
        const auth = app.auth();
        const db = app.firestore();
        const functions = app.functions('us-central1');
    </script>
    <style>
        .input-style { background-color: #374151; border: 1px solid #4B5563; color: #F9FAFB; padding: 0.75rem; border-radius: 0.375rem; }
    </style>
</head>
<body class="bg-gray-900 font-sans text-gray-100">
    <div class="max-w-md mx-auto p-6 bg-gray-800 shadow-xl min-h-screen flex flex-col justify-center">

        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white">ASAMS Master Admin</h1>
            <p class="text-sm text-gray-400 mt-2">Log in to manage the entire system.</p>
        </header>

        <form id="admin-login-form" class="space-y-4">
            <input type="email" id="email-address" placeholder="Email Address" class="input-style w-full" value="waqasmangi.uk@gmail.com" required>
            <input type="password" id="password" placeholder="Password" class="input-style w-full" value="Ayaan@10539" required>
            
            <button type="submit" class="w-full p-3 rounded-lg uppercase font-bold bg-yellow-500 text-gray-900 hover:bg-yellow-400">
                LOG IN
            </button>
        </form>
    </div>

<script>
    const adminLoginForm = document.getElementById('admin-login-form');
    const MASTER_ADMIN_EMAIL = 'waqasmangi.uk@gmail.com';
    const MASTER_ADMIN_PASSWORD = 'Ayaan@10539';

    adminLoginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email-address').value;
        const password = document.getElementById('password').value;

        // Perform login attempt
        auth.signInWithEmailAndPassword(email, password)
            .then(() => {
                // Check if this is the Master Admin email (simple role check)
                if (email === MASTER_ADMIN_EMAIL) {
                    window.location.href = 'master_admin_dashboard.html';
                } else {
                    alert("Access denied. Please use the Saloon Owner or Customer portals.");
                    auth.signOut();
                }
            })
            .catch((error) => {
                alert(`Login Failed: ${error.message}`);
            });
    });
</script>
</body>
</html>
